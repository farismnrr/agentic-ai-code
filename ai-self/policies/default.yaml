version: 2

actions:
  read_workspace:
    approval: auto
  write_ai_self:
    approval: auto
  create_local_tool:
    approval: auto
  install_reviewed_project_skill:
    approval: auto
  run_relevant_validation:
    approval: auto
  git_diff_status:
    approval: auto
  git_commit_task_owned_changes:
    approval: auto
  create_pull_request:
    approval: ask
    constraints:
      - prepare_title_and_body_automatically
      - no_duplicate_pr
      - respect_repository_template
      - respect_codeowners_and_review_policy
  merge_pull_request:
    approval: ask
    constraints:
      - required_checks_passed
      - required_reviews_satisfied
      - no_policy_bypass
  push_shared_or_default_branch:
    approval: ask
    constraints:
      - repository_policy_allows_direct_push
      - no_force
  git_push_current_branch:
    approval: auto
    constraints:
      - no_force
      - no_secrets
      - task_owned_changes_only
      - validation_passed
      - user_did_not_opt_out
  access_secrets:
    approval: ask
  sudo:
    approval: ask
  production_change:
    approval: ask
  destructive_action:
    approval: always_ask
  irreversible_external_action:
    approval: always_ask
