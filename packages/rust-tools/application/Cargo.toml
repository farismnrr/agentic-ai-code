[package]
name = "relay-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Non-default feature: enables RELAY_TEST_GH_PATH override in forge_process::run_gh
# solely for the deterministic Plan-044A provider-fixture acceptance binary.
# Must never appear in [features] default = [...].
# Ordinary cargo build / cargo test / release builds must NOT enable this feature.
test-gh-provider = []

[dependencies]
relay-core.workspace = true
relay-interfaces.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
ring.workspace = true
libc.workspace = true
shell-words.workspace = true
tracing.workspace = true
uuid.workspace = true
time.workspace = true
url.workspace = true

[[example]]
name = "plan044a_issue_reads_acceptance"
path = "examples/plan044a/issue_reads_acceptance.rs"
required-features = ["test-gh-provider"]

[[example]]
name = "plan044a_issue_mutations_acceptance"
path = "examples/plan044a/issue_mutations_acceptance.rs"
required-features = ["test-gh-provider"]

[[example]]
name = "plan044a_issue_transitions_acceptance"
path = "examples/plan044a/issue_transitions_acceptance.rs"
required-features = ["test-gh-provider"]

[[example]]
name = "plan044b_actions_acceptance"
path = "examples/plan044b_actions_acceptance.rs"
required-features = ["test-gh-provider"]

[[example]]
name = "plan046_agent_delegation_acceptance"
path = "examples/plan046/agent_delegation_acceptance.rs"

[[example]]
name = "plan048_agent_capability_acceptance"
path = "examples/plan048/agent_capability_acceptance.rs"
