[package]
name = "rust-tools"
version = "0.0.7-beta"
edition = "2021"
rust-version = "1.88.0" # MSRV


[dependencies]
clap = { version = "4.5.17", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "macos-system-configuration", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
thiserror = "1.0"
shell-words = "1.1.1"
ipnet = "2.12.1"
libc = "0.2.189"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower = { version = "0.5", features = ["limit"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
base64 = "0.22"
jsonschema = { version = "0.49.9", default-features = false }
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }

[[bin]]
name = "searxng-search-tool"
path = "src/bin/searxng-search-tool.rs"

[[bin]]
name = "curl-tool"
path = "src/bin/curl-tool.rs"

[[bin]]
name = "terminal-tool"
path = "src/bin/terminal-tool.rs"

[[bin]]
name = "relay-agent"
path = "src/bin/relay-agent.rs"
