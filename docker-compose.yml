services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    networks:
      - masihawam-net
      - shared-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      # Nuxt's workspace browser and ownership checks resolve paths under
      # NUXT_WORKSPACES_ROOT. The Rust relay is a separate host service and
      # is not mounted into this container.
      - ${NUXT_WORKSPACES_ROOT}:${NUXT_WORKSPACES_ROOT}
    environment:
      - NUXT_OTEL_ENABLED=true
      - NUXT_OTEL_JAEGER_ENDPOINT=http://jaeger:4317
      - NUXT_OTEL_LOKI_PUSH_URL=http://loki:3100/loki/api/v1/push
      # Override the DB URL to use the docker host instead of the container's localhost
      - NUXT_DATABASE_URL=${NUXT_DATABASE_URL_DOCKER:-postgres://postgres:postgres@host.docker.internal:5432/ai-code}

networks:
  masihawam-net:
    external: true
  shared-network:
    external: true
