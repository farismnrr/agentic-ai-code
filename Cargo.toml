[workspace]
members = [
    "packages/rust-tools/core",
    "packages/rust-tools/application",
    "packages/rust-tools/infrastructure",
    "packages/rust-tools/interfaces",
    "packages/rust-tools/cli"
]
resolver = "2"

[workspace.package]
version = "0.0.8-beta"
edition = "2021"
rust-version = "1.88.0"

[workspace.dependencies]
clap = { version = "4.5.17", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "macos-system-configuration", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
thiserror = "1.0"
shell-words = "1.1.1"
ipnet = "2.12.1"
libc = "0.2.189"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower = { version = "0.5", features = ["limit"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting"] }
base64 = "0.22"
jsonschema = { version = "0.49.9", default-features = false }
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
relay-core = { path = "packages/rust-tools/core" }
relay-application = { path = "packages/rust-tools/application" }
relay-infrastructure = { path = "packages/rust-tools/infrastructure" }
relay-interfaces = { path = "packages/rust-tools/interfaces" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
