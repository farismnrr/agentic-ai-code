[workspace]
members = ["packages/rust-tools"]
resolver = "2"

# Keep development and test artifacts small; local debugging symbols are not needed.
# Full symbols and incremental state caused the workspace target directory to grow
# substantially across repeated checks and tests.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
