name: rust-ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/rust-tools"

      - name: Check formatting
        working-directory: packages/rust-tools
        run: cargo fmt -- --check

      - name: Lint with Clippy
        working-directory: packages/rust-tools
        run: cargo clippy -- -D warnings

      - name: Install cargo-audit
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cargo-audit@0.22.2

      - name: Security audit
        run: cargo audit

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies (for parity tests)
        run: pnpm install

      - name: Run tests (including strict parity integration)
        working-directory: packages/rust-tools
        run: cargo test --workspace

  build-release:
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross == true
        run: cargo install cross

      - name: Build release artifacts
        working-directory: packages/rust-tools
        run: |
          if [ "${{ matrix.use-cross }}" == "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package artifacts and generate checksums
        working-directory: packages/rust-tools/target/${{ matrix.target }}/release
        run: |
          mkdir -p dist
          for bin in terminal-tool curl-tool searxng-search-tool; do
            if [ -f "$bin" ]; then
              cp "$bin" "dist/${bin}-${{ matrix.target }}"
              cd dist
              if command -v sha256sum >/dev/null; then
                sha256sum "${bin}-${{ matrix.target }}" > "${bin}-${{ matrix.target }}.sha256"
              else
                shasum -a 256 "${bin}-${{ matrix.target }}" > "${bin}-${{ matrix.target }}.sha256"
              fi
              cd ..
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.target }}
          path: packages/rust-tools/target/${{ matrix.target }}/release/dist/*

