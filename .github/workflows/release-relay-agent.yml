name: Release Relay Agent Binaries

on:
  push:
    tags:
      - 'relay-agent-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build and compile standalone binaries
        run: pnpm --filter @ai-code/relay-agent run compile

      - name: Rename binaries to release asset names
        # pkg's real output names (verified by actually running `compile`
        # locally) are `bundle-<platform>-<arch>`, not the `bundle-linux` /
        # `bundle-win.exe` this step originally assumed — those never
        # existed, so this step would have failed outright the first time
        # this workflow ran.
        run: |
          mkdir -p release-assets
          cp packages/relay-agent/dist/bin/bundle-linux-x64 release-assets/relay-agent-linux-x64
          cp packages/relay-agent/dist/bin/bundle-macos-x64 release-assets/relay-agent-macos-x64
          cp packages/relay-agent/dist/bin/bundle-macos-arm64 release-assets/relay-agent-macos-arm64
          cp packages/relay-agent/dist/bin/bundle-win-x64.exe release-assets/relay-agent-win-x64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/relay-agent-linux-x64
            release-assets/relay-agent-macos-x64
            release-assets/relay-agent-macos-arm64
            release-assets/relay-agent-win-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
