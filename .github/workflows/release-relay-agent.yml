name: Release Relay Agent Binaries

on:
  push:
    tags:
      - 'relay-agent-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: relay-agent-linux-x64
            bin_name: relay-agent
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: relay-agent-macos-x64
            bin_name: relay-agent
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: relay-agent-macos-arm64
            bin_name: relay-agent
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: relay-agent-win-x64.exe
            bin_name: relay-agent.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Build release artifact
        run: cargo build --release --bin relay-agent --target ${{ matrix.target }}

      - name: Package and checksum (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p release-assets
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} release-assets/${{ matrix.asset_name }}
          cd release-assets
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Package and checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p release-assets
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} release-assets/${{ matrix.asset_name }}
          cd release-assets
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Smoke test (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd release-assets
          chmod +x ${{ matrix.asset_name }}
          ./${{ matrix.asset_name }} --help

      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd release-assets
          ./${{ matrix.asset_name }} --help

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/${{ matrix.asset_name }}
            release-assets/${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
