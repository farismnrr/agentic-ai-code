name: Fast CI (ARM64)

on:
  push:
    paths:
      - .ci/fast-arm64-trigger
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fast-arm64-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/farismnrr/agentic-ai-code-sso-auth
  AGENTATION_ENABLED: ${{ vars.AGENTATION_ENABLED || 'false' }}
  BUILDX_BUILDER: sso-auth-ci

jobs:
  quality:
    name: 1. Lint, typecheck, fmt, and Clippy
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate CI resource limits
        run: |
          set -eu
          cpu_count="$(nproc)"
          cpu_limit="$(awk -v count="$cpu_count" 'BEGIN { printf "%.2f", count * 0.80 }')"
          memory_kb="$(awk '/MemTotal:/ { print $2 }' /proc/meminfo)"
          memory_limit="$((memory_kb * 1024 * 80 / 100))"
          echo "CI_CPU_LIMIT=$cpu_limit" >> "$GITHUB_ENV"
          echo "CI_MEMORY_LIMIT=$memory_limit" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDX_BUILDER }}
          keep-state: true
          cache-binary: false

      - name: Limit Buildx CPU and memory
        run: |
          set -eu
          container="$(docker ps --filter "name=buildx_buildkit_${BUILDX_BUILDER}" --format '{{.Names}}' | head -n 1)"
          test -n "$container"
          docker update --cpus "$CI_CPU_LIMIT" --memory "$CI_MEMORY_LIMIT" --memory-swap "$CI_MEMORY_LIMIT" "$container"

      - name: Run quality gates
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform linux/amd64 \
            --build-arg VITE_AGENTATION_ENABLED="$AGENTATION_ENABLED" \
            --target backend-check \
            --file sso-auth/Dockerfile \
            --progress plain \
            --output type=cacheonly \
            .

  guardrail:
    name: 2. Structural guardrail
    needs: quality
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate CI resource limits
        run: |
          set -eu
          cpu_count="$(nproc)"
          cpu_limit="$(awk -v count="$cpu_count" 'BEGIN { printf "%.2f", count * 0.80 }')"
          memory_kb="$(awk '/MemTotal:/ { print $2 }' /proc/meminfo)"
          memory_limit="$((memory_kb * 1024 * 80 / 100))"
          echo "CI_CPU_LIMIT=$cpu_limit" >> "$GITHUB_ENV"
          echo "CI_MEMORY_LIMIT=$memory_limit" >> "$GITHUB_ENV"

      - name: Run structural guardrail
        run: |
          docker run --rm \
            --cpus "$CI_CPU_LIMIT" \
            --memory "$CI_MEMORY_LIMIT" \
            --memory-swap "$CI_MEMORY_LIMIT" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            node:22-bookworm-slim \
            node scripts/guardrail.mjs sso-auth

  build:
    name: 3. Build linux/arm64
    needs: guardrail
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate CI resource limits
        run: |
          set -eu
          cpu_count="$(nproc)"
          cpu_limit="$(awk -v count="$cpu_count" 'BEGIN { printf "%.2f", count * 0.80 }')"
          memory_kb="$(awk '/MemTotal:/ { print $2 }' /proc/meminfo)"
          memory_limit="$((memory_kb * 1024 * 80 / 100))"
          echo "CI_CPU_LIMIT=$cpu_limit" >> "$GITHUB_ENV"
          echo "CI_MEMORY_LIMIT=$memory_limit" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDX_BUILDER }}
          keep-state: true
          cache-binary: false

      - name: Limit Buildx CPU and memory
        run: |
          set -eu
          container="$(docker ps --filter "name=buildx_buildkit_${BUILDX_BUILDER}" --format '{{.Names}}' | head -n 1)"
          test -n "$container"
          docker update --cpus "$CI_CPU_LIMIT" --memory "$CI_MEMORY_LIMIT" --memory-swap "$CI_MEMORY_LIMIT" "$container"

      - name: Validate ARM64 production image build
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform linux/arm64 \
            --build-arg VITE_AGENTATION_ENABLED="$AGENTATION_ENABLED" \
            --file sso-auth/Dockerfile \
            --progress plain \
            --output type=cacheonly \
            .

  publish:
    name: 4. Publish ARM64 validation image
    needs: build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate CI resource limits
        run: |
          set -eu
          cpu_count="$(nproc)"
          cpu_limit="$(awk -v count="$cpu_count" 'BEGIN { printf "%.2f", count * 0.80 }')"
          memory_kb="$(awk '/MemTotal:/ { print $2 }' /proc/meminfo)"
          memory_limit="$((memory_kb * 1024 * 80 / 100))"
          echo "CI_CPU_LIMIT=$cpu_limit" >> "$GITHUB_ENV"
          echo "CI_MEMORY_LIMIT=$memory_limit" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDX_BUILDER }}
          keep-state: true
          cache-binary: false

      - name: Limit Buildx CPU and memory
        run: |
          set -eu
          container="$(docker ps --filter "name=buildx_buildkit_${BUILDX_BUILDER}" --format '{{.Names}}' | head -n 1)"
          test -n "$container"
          docker update --cpus "$CI_CPU_LIMIT" --memory "$CI_MEMORY_LIMIT" --memory-swap "$CI_MEMORY_LIMIT" "$container"

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=fast-arm64
            type=raw,value=${{ github.sha }}-arm64

      - name: Publish ARM64 validation image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: sso-auth/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_AGENTATION_ENABLED=${{ env.AGENTATION_ENABLED }}

      - name: Verify ARM64 manifest and binary
        run: |
          set -eu

          manifest="$(docker buildx imagetools inspect "$IMAGE_NAME:fast-arm64")"
          printf '%s\n' "$manifest"
          printf '%s\n' "$manifest" | grep -Eq 'Platform:[[:space:]]+linux/arm64([[:space:]]|$)'

          container="sso-auth-fast-arm64-inspect-${{ github.run_id }}"
          binary="$RUNNER_TEMP/sso-auth-fast-arm64"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -f "$binary"
          }
          trap cleanup EXIT

          docker pull --platform linux/arm64 "$IMAGE_NAME:fast-arm64"
          docker create --platform linux/arm64 --name "$container" "$IMAGE_NAME:fast-arm64"
          docker cp "$container:/sso-auth" "$binary"

          file "$binary"
          file "$binary" | grep -Eq 'ARM aarch64|aarch64'
