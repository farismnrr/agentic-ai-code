name: CI

on:
  push:
    paths:
      - .ci/trigger
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/farismnrr/agentic-ai-code-sso-auth
  AGENTATION_ENABLED: ${{ vars.AGENTATION_ENABLED || 'false' }}

jobs:
  check-and-publish:
    name: Guardrail, build, and publish
    runs-on:
      - self-hosted
      - Linux
      - X64

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run repository checks
        run: ./scripts/check.sh

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build deployable image
        run: |
          docker build \
            --build-arg VITE_AGENTATION_ENABLED="$AGENTATION_ENABLED" \
            --file sso-auth/Dockerfile \
            --tag "$IMAGE_NAME:refactor-full-fe-be-relay" \
            --tag "$IMAGE_NAME:${{ github.sha }}" \
            .

      - name: Publish deployable image
        run: |
          docker push "$IMAGE_NAME:refactor-full-fe-be-relay"
          docker push "$IMAGE_NAME:${{ github.sha }}"
