name: Full CI (Deploy)

on:
  push:
    paths:
      - .ci/trigger
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/farismnrr/agentic-ai-code-sso-auth
  RELAY_IMAGE_NAME: ghcr.io/farismnrr/agentic-ai-code-relay-agent
  AGENTATION_ENABLED: ${{ vars.AGENTATION_ENABLED || 'false' }}
  BUILDX_BUILDER: sso-auth-ci

jobs:
  quality:
    name: 1. Lint, typecheck, fmt, and Clippy
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate CI resource limits
        run: |
          set -eu
          cpu_count="$(nproc)"
          cpu_limit="$(awk -v count="$cpu_count" 'BEGIN { printf "%.2f", count * 0.80 }')"
          memory_kb="$(awk '/MemTotal:/ { print $2 }' /proc/meminfo)"
          memory_limit="$((memory_kb * 1024 * 80 / 100))"

          echo "CI_CPU_LIMIT=$cpu_limit" >> "$GITHUB_ENV"
          echo "CI_MEMORY_LIMIT=$memory_limit" >> "$GITHUB_ENV"
          echo "CI limits: ${cpu_limit} CPUs, ${memory_limit} bytes RAM"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDX_BUILDER }}
          keep-state: true
          cache-binary: false

      - name: Limit Buildx CPU and memory
        run: |
          set -eu
          container="$(docker ps --filter "name=buildx_buildkit_${BUILDX_BUILDER}" --format '{{.Names}}' | head -n 1)"
          test -n "$container"
          docker update \
            --cpus "$CI_CPU_LIMIT" \
            --memory "$CI_MEMORY_LIMIT" \
            --memory-swap "$CI_MEMORY_LIMIT" \
            "$container"
          docker inspect "$container" --format 'Buildx limits: NanoCpus={{.HostConfig.NanoCpus}} Memory={{.HostConfig.Memory}} MemorySwap={{.HostConfig.MemorySwap}}'

      - name: Run quality gates
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform linux/amd64 \
            --build-arg VITE_AGENTATION_ENABLED="$AGENTATION_ENABLED" \
            --target backend-check \
            --file sso-auth/Dockerfile \
            --progress plain \
            --output type=cacheonly \
            .

      - name: Run Relay quality gates
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform linux/amd64 \
            --target check \
            --file relay-agent/Dockerfile \
            --progress plain \
            --output type=cacheonly \
            .

  guardrail:
    name: 2. Structural guardrail
    needs: quality
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate CI resource limits
        run: |
          set -eu
          cpu_count="$(nproc)"
          cpu_limit="$(awk -v count="$cpu_count" 'BEGIN { printf "%.2f", count * 0.80 }')"
          memory_kb="$(awk '/MemTotal:/ { print $2 }' /proc/meminfo)"
          memory_limit="$((memory_kb * 1024 * 80 / 100))"
          echo "CI_CPU_LIMIT=$cpu_limit" >> "$GITHUB_ENV"
          echo "CI_MEMORY_LIMIT=$memory_limit" >> "$GITHUB_ENV"

      - name: Run structural guardrail
        run: |
          docker run --rm \
            --cpus "$CI_CPU_LIMIT" \
            --memory "$CI_MEMORY_LIMIT" \
            --memory-swap "$CI_MEMORY_LIMIT" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            node:22-bookworm-slim \
            node scripts/guardrail.mjs sso-auth

          docker run --rm \
            --cpus "$CI_CPU_LIMIT" \
            --memory "$CI_MEMORY_LIMIT" \
            --memory-swap "$CI_MEMORY_LIMIT" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            node:22-bookworm-slim \
            node scripts/guardrail.mjs relay-agent
  test:
    name: 3. Rust tests
    needs: guardrail
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate CI resource limits
        run: |
          set -eu
          cpu_count="$(nproc)"
          cpu_limit="$(awk -v count="$cpu_count" 'BEGIN { printf "%.2f", count * 0.80 }')"
          memory_kb="$(awk '/MemTotal:/ { print $2 }' /proc/meminfo)"
          memory_limit="$((memory_kb * 1024 * 80 / 100))"
          echo "CI_CPU_LIMIT=$cpu_limit" >> "$GITHUB_ENV"
          echo "CI_MEMORY_LIMIT=$memory_limit" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDX_BUILDER }}
          keep-state: true
          cache-binary: false

      - name: Limit Buildx CPU and memory
        run: |
          set -eu
          container="$(docker ps --filter "name=buildx_buildkit_${BUILDX_BUILDER}" --format '{{.Names}}' | head -n 1)"
          test -n "$container"
          docker update --cpus "$CI_CPU_LIMIT" --memory "$CI_MEMORY_LIMIT" --memory-swap "$CI_MEMORY_LIMIT" "$container"

      - name: Run Rust tests
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform linux/amd64 \
            --build-arg VITE_AGENTATION_ENABLED="$AGENTATION_ENABLED" \
            --target backend-test \
            --file sso-auth/Dockerfile \
            --progress plain \
            --output type=cacheonly \
            .

      - name: Run Relay tests
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform linux/amd64 \
            --target check \
            --file relay-agent/Dockerfile \
            --progress plain \
            --output type=cacheonly \
            .

  build:
    name: 4. Build ${{ matrix.platform }}
    needs: test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate CI resource limits
        run: |
          set -eu
          cpu_count="$(nproc)"
          cpu_limit="$(awk -v count="$cpu_count" 'BEGIN { printf "%.2f", count * 0.80 }')"
          memory_kb="$(awk '/MemTotal:/ { print $2 }' /proc/meminfo)"
          memory_limit="$((memory_kb * 1024 * 80 / 100))"
          echo "CI_CPU_LIMIT=$cpu_limit" >> "$GITHUB_ENV"
          echo "CI_MEMORY_LIMIT=$memory_limit" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDX_BUILDER }}
          keep-state: true
          cache-binary: false

      - name: Limit Buildx CPU and memory
        run: |
          set -eu
          container="$(docker ps --filter "name=buildx_buildkit_${BUILDX_BUILDER}" --format '{{.Names}}' | head -n 1)"
          test -n "$container"
          docker update --cpus "$CI_CPU_LIMIT" --memory "$CI_MEMORY_LIMIT" --memory-swap "$CI_MEMORY_LIMIT" "$container"

      - name: Validate production image build
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform "${{ matrix.platform }}" \
            --build-arg VITE_AGENTATION_ENABLED="$AGENTATION_ENABLED" \
            --file sso-auth/Dockerfile \
            --progress plain \
            --output type=cacheonly \
            .

      - name: Validate Relay production image build
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform "${{ matrix.platform }}" \
            --file relay-agent/Dockerfile \
            --progress plain \
            --output type=cacheonly \
            .

  e2e:
    name: 5. Playwright E2E
    needs: build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate CI resource limits
        run: |
          set -eu
          cpu_count="$(nproc)"
          cpu_limit="$(awk -v count="$cpu_count" 'BEGIN { printf "%.2f", count * 0.80 }')"
          memory_kb="$(awk '/MemTotal:/ { print $2 }' /proc/meminfo)"
          memory_limit="$((memory_kb * 1024 * 80 / 100))"
          echo "CI_CPU_LIMIT=$cpu_limit" >> "$GITHUB_ENV"
          echo "CI_MEMORY_LIMIT=$memory_limit" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDX_BUILDER }}
          keep-state: true
          cache-binary: false

      - name: Limit Buildx CPU and memory
        run: |
          set -eu
          container="$(docker ps --filter "name=buildx_buildkit_${BUILDX_BUILDER}" --format '{{.Names}}' | head -n 1)"
          test -n "$container"
          docker update --cpus "$CI_CPU_LIMIT" --memory "$CI_MEMORY_LIMIT" --memory-swap "$CI_MEMORY_LIMIT" "$container"

      - name: Build local AMD64 app image
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform linux/amd64 \
            --build-arg VITE_AGENTATION_ENABLED="$AGENTATION_ENABLED" \
            --file sso-auth/Dockerfile \
            --tag "$IMAGE_NAME:${{ github.sha }}" \
            --load \
            .

      - name: Build Playwright runner
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform linux/amd64 \
            --file sso-auth/e2e/Dockerfile \
            --tag masih-awam/sso-auth-e2e:${{ github.sha }} \
            --load \
            .

      - name: Run Playwright E2E
        run: |
          set -eu

          network="sso-auth-e2e-${{ github.run_id }}"
          app="sso-auth-e2e-app-${{ github.run_id }}"
          runner="sso-auth-e2e-runner-${{ github.run_id }}"
          artifacts="$RUNNER_TEMP/sso-auth-e2e"

          mkdir -p "$artifacts"
          docker network create "$network"

          cleanup() {
            docker rm -f "$app" >/dev/null 2>&1 || true
            docker rm -f "$runner" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$app" \
            --network "$network" \
            -e PORT=3000 \
            -e SSO_BASE_URL="http://$app:3000" \
            -e GITHUB_CLIENT_ID=e2e-client \
            -e GITHUB_CLIENT_SECRET=e2e-secret \
            -e GITHUB_CALLBACK_URL="http://$app:3000/auth/github/callback" \
            -e GITHUB_AUTHORIZE_URL=http://localhost:4400/authorize \
            -e GITHUB_TOKEN_URL="http://$runner:4400/token" \
            -e GITHUB_API_URL="http://$runner:4400/" \
            -e ALLOWED_GITHUB_USER_IDS=120432426 \
            -e SESSION_SECRET=e2e-session-secret-32-bytes-minimum-value \
            -e RELAY_ASSERTION_SECRET=e2e-relay-assertion-secret-32-bytes-minimum \
            "$IMAGE_NAME:${{ github.sha }}"

          docker run --rm \
            --name "$runner" \
            --network "$network" \
            -e E2E_BASE_URL="http://$app:3000" \
            -e E2E_ARTIFACT_DIR=/artifacts \
            -v "$artifacts:/artifacts" \
            masih-awam/sso-auth-e2e:${{ github.sha }}

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sso-auth-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/sso-auth-e2e
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: 6. Publish multi-platform image
    needs: e2e
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate CI resource limits
        run: |
          set -eu
          cpu_count="$(nproc)"
          cpu_limit="$(awk -v count="$cpu_count" 'BEGIN { printf "%.2f", count * 0.80 }')"
          memory_kb="$(awk '/MemTotal:/ { print $2 }' /proc/meminfo)"
          memory_limit="$((memory_kb * 1024 * 80 / 100))"
          echo "CI_CPU_LIMIT=$cpu_limit" >> "$GITHUB_ENV"
          echo "CI_MEMORY_LIMIT=$memory_limit" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDX_BUILDER }}
          keep-state: true
          cache-binary: false

      - name: Limit Buildx CPU and memory
        run: |
          set -eu
          container="$(docker ps --filter "name=buildx_buildkit_${BUILDX_BUILDER}" --format '{{.Names}}' | head -n 1)"
          test -n "$container"
          docker update --cpus "$CI_CPU_LIMIT" --memory "$CI_MEMORY_LIMIT" --memory-swap "$CI_MEMORY_LIMIT" "$container"

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: sso-auth/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_AGENTATION_ENABLED=${{ env.AGENTATION_ENABLED }}

      - name: Prepare Relay image metadata
        id: relay-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.RELAY_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Publish Relay multi-platform image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: relay-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.relay-meta.outputs.tags }}
          labels: ${{ steps.relay-meta.outputs.labels }}

      - name: Verify published image platforms
        run: |
          set -eu
          for image in "$IMAGE_NAME:latest" "$RELAY_IMAGE_NAME:latest"; do
            manifest="$(docker buildx imagetools inspect "$image")"
            printf '%s\n' "$manifest"
            printf '%s\n' "$manifest" | grep -Eq 'Platform:[[:space:]]+linux/amd64([[:space:]]|$)'
            printf '%s\n' "$manifest" | grep -Eq 'Platform:[[:space:]]+linux/arm64([[:space:]]|$)'
          done

      - name: Verify ARM64 binary architecture
        run: |
          set -eu

          verify_binary() {
            image="$1"
            source_path="$2"
            name="$3"
            container="${name}-arm64-inspect-${{ github.run_id }}"
            binary="$RUNNER_TEMP/${name}-arm64"

            docker pull --platform linux/arm64 "$image"
            docker create --platform linux/arm64 --name "$container" "$image"
            docker cp "$container:$source_path" "$binary"
            docker rm -f "$container"

            file "$binary"
            file "$binary" | grep -Eq 'ARM aarch64|aarch64'
            rm -f "$binary"
          }

          verify_binary "$IMAGE_NAME:latest" /sso-auth sso-auth
          verify_binary "$RELAY_IMAGE_NAME:latest" /relay-agent relay-agent
