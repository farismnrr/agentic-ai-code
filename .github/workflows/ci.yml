name: CI

on:
  push:
    branches: [main, dev]
    tags:
      - 'relay-agent-v*'
  pull_request:

permissions:
  contents: write

jobs:
  js-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: JS Lint
        run: pnpm run lint

      - name: JS Typecheck
        run: pnpm run typecheck

      - name: JS Audit
        run: pnpm audit

  rust-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/rust-tools"

      - name: Check Rust formatting
        working-directory: packages/rust-tools
        run: cargo fmt --all -- --check

      - name: Strict cargo check
        working-directory: packages/rust-tools
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Lint with Clippy
        working-directory: packages/rust-tools
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Install cargo-audit
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cargo-audit@0.22.2

      - name: Rust Security audit
        run: cargo audit

  build-release:
    needs: [js-ci, rust-ci]
    strategy:
      matrix:
        include:
          # Platform contract: relay-agent is Linux+bwrap only.
          # macOS and Windows targets are removed — there is no secure sandbox
          # equivalent for those platforms and no insecure fallback is acceptable.
          # See compile_error! in src/bin/relay-agent.rs.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross == true
        run: cargo install cross

      - name: Build release artifacts
        run: |
          if [ "${{ matrix.use-cross }}" == "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package artifacts and generate checksums
        working-directory: target/${{ matrix.target }}/release
        run: |
          mkdir -p dist
          for bin in terminal-tool curl-tool searxng-search-tool relay-agent; do
            if [ -f "$bin" ]; then
              cp "$bin" "dist/${bin}-${{ matrix.target }}"
              cd dist
              if command -v sha256sum >/dev/null; then
                sha256sum "${bin}-${{ matrix.target }}" > "${bin}-${{ matrix.target }}.sha256"
              else
                shasum -a 256 "${bin}-${{ matrix.target }}" > "${bin}-${{ matrix.target }}.sha256"
              fi
              cd ..
            fi
          done

      - name: Smoke test artifacts
        working-directory: target/${{ matrix.target }}/release/dist
        run: |
          for bin in terminal-tool curl-tool searxng-search-tool relay-agent; do
            bin_name="${bin}-${{ matrix.target }}"

            # Verify SHA256 checksum file exists
            if [ ! -f "${bin_name}.sha256" ]; then
              echo "Error: Checksum file ${bin_name}.sha256 not found!"
              exit 1
            fi

            # Check if this target can be executed on the current runner
            # GitHub's macos-latest is now ARM-based (macos-14), so both Apple targets work (x86_64 via Rosetta 2)
            if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
              echo "Skipping execution for cross-compiled target ${{ matrix.target }}"
              continue
            fi

            echo "Running smoke test for ${bin_name}..."
            chmod +x "./${bin_name}"
            "./${bin_name}" --help
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/dist/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/relay-agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
