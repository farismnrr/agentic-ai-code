name: CI

on:
  push:
    paths:
      - .ci/trigger
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/farismnrr/agentic-ai-code-sso-auth
  AGENTATION_ENABLED: ${{ vars.AGENTATION_ENABLED || 'false' }}

jobs:
  check-and-publish:
    name: Guardrail, E2E, build, and publish
    runs-on:
      - self-hosted
      - Linux
      - X64

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run repository checks
        run: ./scripts/check.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local AMD64 image for E2E
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg VITE_AGENTATION_ENABLED="$AGENTATION_ENABLED" \
            --file sso-auth/Dockerfile \
            --tag "$IMAGE_NAME:${{ github.sha }}" \
            .

      - name: Build Playwright runner
        run: |
          docker build \
            --file sso-auth/e2e/Dockerfile \
            --tag masih-awam/sso-auth-e2e:${{ github.sha }} \
            .

      - name: Run Playwright E2E
        run: |
          set -eu

          network="sso-auth-e2e-${{ github.run_id }}"
          app="sso-auth-e2e-app-${{ github.run_id }}"
          runner="sso-auth-e2e-runner-${{ github.run_id }}"
          artifacts="$RUNNER_TEMP/sso-auth-e2e"

          mkdir -p "$artifacts"
          docker network create "$network"

          cleanup() {
            docker rm -f "$app" >/dev/null 2>&1 || true
            docker rm -f "$runner" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$app" \
            --network "$network" \
            -e PORT=3000 \
            -e SSO_BASE_URL="http://$app:3000" \
            -e GITHUB_CLIENT_ID=e2e-client \
            -e GITHUB_CLIENT_SECRET=e2e-secret \
            -e GITHUB_CALLBACK_URL="http://$app:3000/auth/github/callback" \
            -e GITHUB_AUTHORIZE_URL=http://localhost:4400/authorize \
            -e GITHUB_TOKEN_URL="http://$runner:4400/token" \
            -e GITHUB_API_URL="http://$runner:4400/" \
            -e SESSION_SECRET=e2e-session-secret-32-bytes-minimum-value \
            "$IMAGE_NAME:${{ github.sha }}"

          docker run --rm \
            --name "$runner" \
            --network "$network" \
            -e E2E_BASE_URL="http://$app:3000" \
            -e E2E_ARTIFACT_DIR=/artifacts \
            -v "$artifacts:/artifacts" \
            masih-awam/sso-auth-e2e:${{ github.sha }}

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sso-auth-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/sso-auth-e2e
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sso-auth/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_AGENTATION_ENABLED=${{ env.AGENTATION_ENABLED }}
          cache-from: type=gha,scope=sso-auth
          cache-to: type=gha,mode=max,scope=sso-auth

      - name: Verify published image platforms
        run: |
          set -eu

          manifest="$(docker buildx imagetools inspect "$IMAGE_NAME:latest")"
          printf '%s\n' "$manifest"

          printf '%s\n' "$manifest" | grep -Eq 'Platform:[[:space:]]+linux/amd64([[:space:]]|$)'
          printf '%s\n' "$manifest" | grep -Eq 'Platform:[[:space:]]+linux/arm64([[:space:]]|$)'
